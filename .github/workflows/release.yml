name: Build and attach installer

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y

      - name: Generate signing certificate
        shell: powershell
        run: |
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=ClaudeUsageWidgetLocal" `
            -KeyUsage DigitalSignature `
            -FriendlyName "ClaudeUsageWidgetLocal (CI)" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}Subject Type:End Entity") `
            -NotAfter (Get-Date).AddYears(10)
          "CertThumbprint=$($cert.Thumbprint)" | Out-Host
          "`$CertThumbprint = `"$($cert.Thumbprint)`"" | Set-Content local.settings.ps1
          "`$BuildCacheRoot = `"`"" | Add-Content local.settings.ps1

      - name: Build, sign, and package installer
        shell: powershell
        run: powershell -File package-release.ps1

      - name: Attach installer to release
        uses: softprops/action-gh-release@v2
        with:
          files: release/output/ClaudeWidgetSetup.exe
